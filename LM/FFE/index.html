<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tabletop - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Nexus Tabletop</span>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 text-center">
                <h1 class="display-4 mb-4">Bienvenido a Nexus Tabletop</h1>
                <p class="lead mb-5">Sistema de gestión de catálogo desarrollado con estándares abiertos.</p>
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="h4 mb-4">Acceso al Inventario</h2>
                        <p class="text-muted mb-4">
                            Accede al catálogo de juegos de mesa. Los datos están estructurados en XML, validados mediante DTD y estilizados dinámicamente con XSLT.
                        </p>
                        <a href="catalogo.xml" class="btn btn-primary btn-lg">Ver Catálogo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
