<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Reseña</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
    <div class="header">
        ¡Únete a nuestra comunidad!
    </div>

    <div class="form-body">
        <h2>Formulario de Reseña de producto</h2>
        <p class="subtitle">Eutod et auitilacto ex de comunida de pistro de lesidos.</p>

        <form action="#" method="POST">

            <label for="producto">Nombre del Producto</label>
            <input type="text" id="producto" name="producto" placeholder="Nombre del Producto" required>

            <label for="valoracion">Valoración</label>
            <select id="valoracion" name="valoracion">
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="5">Excelente</option>
                <option value="4">Muy bueno</option>
                <option value="3">Bueno</option>
                <option value="2">Regular</option>
                <option value="1">Malo</option>
            </select>

            <label for="comentario">Comentario</label>
            <textarea id="comentario" name="comentario"></textarea>

            <div class="recommendation-row">
                <label style="margin:0;">Recomendación</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="recomienda" value="si"> Sí
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recomienda" value="no"> No
                    </label>
                </div>
            </div>

            <div class="email-box">
                <label for="email">Correo Electrónico</label>
                <input type="text" id="email" name="email" placeholder="nombre@email.com">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Enviar Reseña</button>
                <button type="button" class="btn-cancel">Cancelar</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
